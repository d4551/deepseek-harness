# Swarm profile layer. Apply after dsh-base: it retunes the Team rows base
# mounts for every profile — pull-based coordination and a wider roster — and
# bounds the Subagent seam's one-shot runs. A patch replaces a row's whole
# config, so each row restates every key it owns.
#
# A swarm's teammates are continuable children and stay outside the one-shot run
# ceiling; the ceiling bounds the foreground `subagent`/`subagent_fork`
# delegations several teammates may fan out at the same time.

- id: subagent
  config:
    maxConcurrentRuns: 8

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot

- id: agent-team
  config:
    maxMembers: 16
    maxTasks: 256
    maxPendingMessagesPerMember: 64
    maxMessageBytes: 65536
    disposalTimeoutMs: 5000

- id: tool-agent-team
  config:
    freshProvider: spawn
    forkProvider: fork
    coordination: swarm
